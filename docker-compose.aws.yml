# Production & Test Extra Configuration
# Run via: `docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d`

services:
  n8n:
    # Bind to all interfaces so the ALB can reach port 5678 over the VPC.
    # The EC2 security group restricts inbound 5678 to ALB traffic only.
    ports:
      - "5678:5678"

    environment:
      # Override the base webhook URL to exclude the port.
      # The ALB terminates HTTPS on 443, so the public URL has no port.
      - WEBHOOK_URL=${N8N_PROTOCOL:-https}://${N8N_HOST}

    # JSON file logging — readable by CloudWatch Agent or Fluent Bit
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    # Postgres is NOT exposed outside the Docker network in production.
    # It communicates with n8n entirely on the internal compose network.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
