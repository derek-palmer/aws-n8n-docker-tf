# AWS Host Configuration
# Run via: `docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d`

services:
  n8n:
    environment:
      # Override the base webhook URL to exclude the port.
      # Caddy terminates HTTPS on 443, so the public URL has no port.
      - WEBHOOK_URL=${N8N_PROTOCOL:-https}://${N8N_HOST}

    # JSON file logging — readable by CloudWatch Agent or Fluent Bit
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - N8N_HOST=${N8N_HOST}
      - TLS_CONTACT_EMAIL=${TLS_CONTACT_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    # Postgres is NOT exposed outside the Docker network in production.
    # It communicates with n8n entirely on the internal compose network.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  caddy_data:
  caddy_config:
