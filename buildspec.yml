version: 0.2

# BuildSpec for n8n on AWS Graviton (arm64)
# This build runs on an ARM CodeBuild image to match the Graviton EC2 target.
# Required environment variables (injected by Terraform):
#   ECR_REPO_URL     - the full ECR repo URL (e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com/n8n)
#   AWS_DEFAULT_REGION
#   AWS_ACCOUNT_ID
#   ENV              - test | prod

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      
      - echo "Retrieving Docker Hub credentials from SSM..."
      - |
        DOCKERHUB_SSM_STDERR_FILE=$(mktemp)
        if DOCKERHUB_CREDS=$(aws ssm get-parameter --name "$DOCKERHUB_CREDENTIALS_PATH" --with-decryption --query "Parameter.Value" --output text 2>"$DOCKERHUB_SSM_STDERR_FILE"); then
          DOCKERHUB_SSM_STATUS=0
        else
          DOCKERHUB_SSM_STATUS=$?
        fi
        DOCKERHUB_SSM_STDERR=$(cat "$DOCKERHUB_SSM_STDERR_FILE")
        rm -f "$DOCKERHUB_SSM_STDERR_FILE"

        if [ "$DOCKERHUB_SSM_STATUS" -eq 0 ]; then
          if ! DOCKERHUB_AUTH_LINES=$(printf '%s' "$DOCKERHUB_CREDS" | jq -er '.username as $username | .token as $token | if ($username | type) == "string" and ($username | length) > 0 and ($token | type) == "string" and ($token | length) > 0 then $username, $token else error("expected non-empty .username and .token strings") end'); then
            echo "ERROR: Invalid Docker Hub credentials JSON at $DOCKERHUB_CREDENTIALS_PATH. Expected non-empty .username and .token strings."
            exit 1
          fi
          DOCKERHUB_USERNAME=$(printf '%s\n' "$DOCKERHUB_AUTH_LINES" | sed -n '1p')
          DOCKERHUB_TOKEN=$(printf '%s\n' "$DOCKERHUB_AUTH_LINES" | sed -n '2p')

          echo "Logging in to Docker Hub..."
          printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
        elif printf '%s' "$DOCKERHUB_SSM_STDERR" | grep -q "ParameterNotFound"; then
          echo "No Docker Hub credentials found at $DOCKERHUB_CREDENTIALS_PATH. Proceeding without authentication (may hit rate limits)."
        else
          echo "ERROR: Failed to fetch Docker Hub credentials from $DOCKERHUB_CREDENTIALS_PATH."
          if [ -n "$DOCKERHUB_SSM_STDERR" ]; then
            echo "$DOCKERHUB_SSM_STDERR"
          fi
          exit 1
        fi

      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-7)
      - echo "Image tag = $IMAGE_TAG"

  build:
    commands:
      - echo "Pulling pinned n8n image from $N8N_UPSTREAM_REF"
      - docker pull "$N8N_UPSTREAM_REF"
      
      - echo "Tagging image..."
      - docker tag "$N8N_UPSTREAM_REF" "$ECR_REPO_URL:$IMAGE_TAG"
      - docker tag "$N8N_UPSTREAM_REF" "$ECR_REPO_URL:latest"

  post_build:
    commands:
      - echo "Pushing image to ECR..."
      - docker push "$ECR_REPO_URL:$IMAGE_TAG"
      - docker push "$ECR_REPO_URL:latest"

      # Pin the deployed image to this build's ECR tag. Kept separate from
      # .env.<env>, which deploy.sh regenerates from SSM on the instance.
      - printf 'ECR_REPO_URL=%s\nIMAGE_TAG=%s\n' "$ECR_REPO_URL" "$IMAGE_TAG" > build.env

artifacts:
  files:
    - Caddyfile
    - docker-compose.yml
    - docker-compose.aws.yml
    - scripts/**/*
    - appspec.yml
    - build.env
  discard-paths: no
